[pytest]
# This machine has an inaccessible AppData\Local\Temp\pytest-of-* directory
# (Windows permissions, not a project issue) that breaks pytest's default
# tmp_path fixture and cache-file writes. Redirect both to a writable,
# project-local directory so `pytest` works with no extra flags.
addopts = -p no:cacheprovider --basetemp=.pytest_tmp
